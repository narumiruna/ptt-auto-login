name: Cron
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  login-cron:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv sync
      - name: Run login cron
        env:
          PTT_ACCOUNTS: ${{ secrets.PTT_ACCOUNTS }}
        run: |
          uv run pttautologin
